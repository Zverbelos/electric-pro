name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 🔍 Show repo structure
        run: |
          echo "=== Root directory ==="
          ls -la
          echo ""
          echo "=== Find all gradle files ==="
          find . -name "*.gradle*" -not -path "*/node_modules/*"
          echo ""
          echo "=== Find settings.gradle exactly ==="
          find . -name "settings.gradle*"
          echo ""
          echo "=== Find all .txt files ==="
          find . -name "*.txt" | head -30

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Download Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-build-cache --stacktrace
        continue-on-error: true

      - name: 📂 Show what we have after build
        if: always()
        run: |
          echo "=== APK location ==="
          find . -name "*.apk" || echo "No APK found"
          echo ""
          echo "=== app directory ==="
          ls -la app/ 2>/dev/null || echo "No app folder"
