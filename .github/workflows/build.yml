name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ./electric-pro/electric-pro
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 🔍 Find settings.gradle
        run: |
          echo "=== current dir ==="
          pwd
          echo "=== files here ==="
          ls -la
          echo "=== find any settings.gradle ==="
          find /home/runner/work -name "settings.gradle" 2>/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Download Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ElectricPro-debug
          path: electric-pro/electric-pro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
